<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ಅಡ್ಮಿನ್ ಪ್ಯಾನೆಲ್ - ಸಮೃದ್ಧಿ</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    /* ಲಾಗಿನ್ ಲಾಕ್ ಸ್ಕ್ರೀನ್ ಸ್ಟೈಲ್ */
    #adminLockScreen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0f172a;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lock-card {
      background: #ffffff;
      width: 100%;
      max-width: 320px;
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .lock-input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      text-align: center;
      letter-spacing: 4px;
      margin: 14px 0 10px;
      box-sizing: border-box;
      outline: none;
    }
    .lock-btn {
      width: 100%;
      background: #059669;
      color: #fff;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .logout-btn {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #f87171;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .admin-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin: 10px 14px;
    }
    .btn-approve { background: #059669; color: #fff; border:none; padding: 6px 14px; border-radius: 6px; font-weight:800; font-size:12px; cursor: pointer; }
    .btn-delete { background: #dc2626; color: #fff; border:none; padding: 6px 14px; border-radius: 6px; font-weight:800; font-size:12px; cursor: pointer; margin-left: 6px; }
  </style>
</head>
<body style="background: #f8fafc; display: none;" id="adminBody">

  <!-- 🔒 ಪಾಸ್‌ವರ್ಡ್ ಲಾಕ್ ಸ್ಕ್ರೀನ್ (Password Gate) -->
  <div id="adminLockScreen">
    <div class="lock-card">
      <div style="font-size: 40px; margin-bottom: 8px;">🔐</div>
      <h3 style="margin: 0; color: #0f172a; font-size: 17px; font-weight: 800;">ಅಡ್ಮಿನ್ ಪರಿಶೀಲನೆ</h3>
      <p style="font-size: 11.5px; color: #64748b; margin: 4px 0 10px;">ಪ್ರವೇಶಿಸಲು ನಿಮ್ಮ ರಹಸ್ಯ PIN / Password ಹಾಕಿ</p>
      
      <input type="password" id="adminPassInput" class="lock-input" placeholder="••••" maxlength="10">
      <button onclick="checkAdminPassword()" class="lock-btn">ಅನ್ಲಾಕ್ ಮಾಡಿ ➔</button>
      <div id="lockErrMsg" style="color: #dc2626; font-size: 11px; font-weight: 700; margin-top: 8px; display: none;">❌ ತಪ್ಪು ಪಾಸ್‌ವರ್ಡ್!</div>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header-modern">
    <a href="index.html" class="brand-logo-wrap">
      <div class="brand-icon">⚙️</div>
      <div class="brand-title-box">
        <span class="brand-name">ಅಡ್ಮಿನ್ ಪ್ಯಾನೆಲ್</span>
        <span class="brand-tag">ಜಾಹೀರಾತುಗಳ ನಿರ್ವಹಣೆ</span>
      </div>
    </a>
    <button onclick="logoutAdmin()" class="logout-btn">🔒 ಲಾಕ್‌ಔಟ್</button>
  </header>

  <!-- News & Market Rates Live Control -->
  <div style="background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 14px; margin: 10px 14px;">
    <h3 style="font-size: 13.5px; font-weight: 800; color: #0f172a; margin: 0 0 10px;">📈 ಮಾರುಕಟ್ಟೆ ದರಗಳ ಬದಲಾವಣೆ</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px;">
      <div>
        <label>ಅಡಿಕೆ ದರ:</label>
        <input type="text" id="adm_adike" placeholder="ರಾಶಿ ₹54,500/ಕ್ವಿಂ" style="width:100%; padding:6px; border:1px solid #cbd5e1; border-radius:6px; margin-top:2px;">
      </div>
      <div>
        <label>ಕೊಬ್ಬರಿ ದರ:</label>
        <input type="text" id="adm_kobbari" placeholder="₹13,200/ಕ್ವಿಂ" style="width:100%; padding:6px; border:1px solid #cbd5e1; border-radius:6px; margin-top:2px;">
      </div>
      <div>
        <label>ಮೆಕ್ಕೆಜೋಳ ದರ:</label>
        <input type="text" id="adm_maize" placeholder="₹2,150/ಕ್ವಿಂ" style="width:100%; padding:6px; border:1px solid #cbd5e1; border-radius:6px; margin-top:2px;">
      </div>
      <div>
        <label>ಪೆಟ್ರೋಲ್ ದರ:</label>
        <input type="text" id="adm_petrol" placeholder="₹102.80" style="width:100%; padding:6px; border:1px solid #cbd5e1; border-radius:6px; margin-top:2px;">
      </div>
    </div>
    <button onclick="saveLiveRates()" style="background:#0284c7; color:#fff; border:none; padding:8px 14px; border-radius:6px; font-weight:800; font-size:11.5px; margin-top:10px; width:100%; cursor:pointer;">💾 ದರಗಳನ್ನು ಅಪ್‌ಡೇಟ್ ಮಾಡಿ</button>
  </div>

  <!-- Pending Approvals Section -->
  <div style="padding: 4px 16px;">
    <h3 style="font-size: 14px; font-weight: 800; color: #0f172a; margin: 0;">⏳ ಹೊಸ ಜಾಹೀರಾತುಗಳು (Pending Approvals)</h3>
  </div>

  <div id="pendingAdsList">
    <p style="text-align:center; font-size:12px; color:#64748b; padding:20px 0;">ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ...</p>
  </div>

  <!-- Bottom Nav -->
  <nav class="modern-bottom-nav">
    <a href="index.html" class="nav-tab-link"><span class="nav-tab-icon">🏠</span><span>ಮುಖಪುಟ</span></a>
    <a href="order_poster.html" class="nav-tab-link"><span class="nav-tab-icon">🎨</span><span>ಪೋಸ್ಟರ್ ₹59</span></a>
    <a href="post_ad.html" class="nav-center-plus">➕</a>
    <a href="admin.html" class="nav-tab-link active"><span class="nav-tab-icon">⚙️</span><span>ಅಡ್ಮಿನ್</span></a>
    <a href="https://wa.me/918431649984" class="nav-tab-link"><span class="nav-tab-icon">💬</span><span>ಹೆಲ್ಪ್‌ಲೈನ್</span></a>
  </nav>

  <!-- Script for Lock & Database Admin Logic -->
  <script>
    // 🔑 ನಿಮ್ಮ ರಹಸ್ಯ ಅಡ್ಮಿನ್ ಪಾಸ್‌ವರ್ಡ್ (ಇಲ್ಲಿ ಬದಲಾಯಿಸಿಕೊಳ್ಳಬಹುದು)
    const ADMIN_PASSWORD = "5462";

    function checkAuth() {
      const isAuth = sessionStorage.getItem("samruddhi_admin_auth");
      const lockScreen = document.getElementById("adminLockScreen");
      const body = document.getElementById("adminBody");

      body.style.display = "block";
      if (isAuth === "true") {
        lockScreen.style.display = "none";
        loadPendingAds();
      } else {
        lockScreen.style.display = "flex";
      }
    }

    function checkAdminPassword() {
      const input = document.getElementById("adminPassInput").value.trim();
      const err = document.getElementById("lockErrMsg");

      if (input === ADMIN_PASSWORD) {
        sessionStorage.setItem("samruddhi_admin_auth", "true");
        document.getElementById("adminLockScreen").style.display = "none";
        err.style.display = "none";
        loadPendingAds();
      } else {
        err.style.display = "block";
        document.getElementById("adminPassInput").value = "";
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem("samruddhi_admin_auth");
      location.reload();
    }

    async function loadPendingAds() {
      const container = document.getElementById('pendingAdsList');
      try {
        if (typeof db === 'undefined') return;

        const snapshot = await db.collection("ads").where("status", "==", "pending").get();
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = `<p style="text-align:center; font-size:12.5px; color:#64748b; padding:20px;">✅ ಯಾವುದೇ ಹೊಸ ಜಾಹೀರಾತುಗಳು ಬಾಕಿ ಇಲ್ಲ!</p>`;
          return;
        }

        snapshot.forEach(doc => {
          const ad = doc.data();
          const docId = doc.id;
          const imgTag = ad.imageUrl ? `<img src="${ad.imageUrl}" style="width:100%; max-height:160px; object-fit:cover; border-radius:8px; margin:6px 0;">` : '';

          container.innerHTML += `
            <div class="admin-card" id="ad_card_${docId}">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="background:#fef3c7; color:#b45309; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:4px;">📍 ${ad.cityName || ad.city}</span>
                <span style="font-size:11px; font-weight:800; color:#059669;">₹${ad.amount || 0} (${ad.planType || 'Free'})</span>
              </div>
              ${imgTag}
              <div style="font-size:13.5px; font-weight:800; color:#0f172a; margin-top:6px;">${ad.title}</div>
              <div style="font-size:12px; color:#475569; margin:4px 0 8px;">${ad.desc || ad.description || ''}</div>
              <div style="font-size:11px; color:#64748b; margin-bottom:8px;">👤 ಸಂಪರ್ಕ: ${ad.phone || 'ಲಭ್ಯವಿಲ್ಲ'} | UTR: <strong>${ad.utr || 'ಇಲ್ಲ'}</strong></div>
              
              <div style="display:flex; justify-content:flex-end;">
                <button onclick="approveAd('${docId}')" class="btn-approve">✅ Approve (ಲೈವ್ ಹಾಕಿ)</button>
                <button onclick="deleteAd('${docId}')" class="btn-delete">🗑️ Delete</button>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function approveAd(docId) {
      if (!confirm("ಈ ಜಾಹೀರಾತನ್ನು ಅನುಮೋದಿಸಿ ಲೈವ್ ಮಾಡಬೇಕೇ?")) return;
      try {
        await db.collection("ads").doc(docId).update({ status: "approved" });
        alert("🎉 ಜಾಹೀರಾತು ಲೈವ್ ಆಗಿದೆ!");
        document.getElementById(`ad_card_${docId}`)?.remove();
      } catch (err) {
        alert("ದೋಷ: " + err.message);
      }
    }

    async function deleteAd(docId) {
      if (!confirm("ಖಚಿತವಾಗಿ ಈ ಜಾಹೀರಾತನ್ನು ಡಿಲೀಟ್ ಮಾಡಬೇಕೇ?")) return;
      try {
        await db.collection("ads").doc(docId).delete();
        alert("🗑️ ಜಾಹೀರಾತು ಡಿಲೀಟ್ ಆಗಿದೆ!");
        document.getElementById(`ad_card_${docId}`)?.remove();
      } catch (err) {
        alert("ದೋಷ: " + err.message);
      }
    }

    function saveLiveRates() {
      const data = {
        adike: document.getElementById('adm_adike').value,
        kobbari: document.getElementById('adm_kobbari').value,
        maize: document.getElementById('adm_maize').value,
        petrol: document.getElementById('adm_petrol').value
      };
      localStorage.setItem('samruddhi_rates_data', JSON.stringify(data));
      alert("✅ ಮಾರುಕಟ್ಟೆ ದರಗಳನ್ನು ಯಶಸ್ವಿಯಾಗಿ ಸೇವ್ ಮಾಡಲಾಗಿದೆ!");
    }

    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>
</html>
