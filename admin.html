<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ಅಡ್ಮಿನ್ ಕಂಟ್ರೋಲ್ ಪ್ಯಾನೆಲ್ - ಸಮೃದ್ಧಿ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .form-card {
      background: #ffffff;
      margin: 12px 14px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .admin-tab-btn {
      padding: 6px 12px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      cursor: pointer;
      white-space: nowrap;
    }
    .admin-tab-btn.active {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
    .form-input {
      width: 100%;
      padding: 8px 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <header class="app-header-modern">
    <a href="index.html" class="brand-logo-wrap">
      <div class="brand-icon">⚙️</div>
      <div class="brand-title-box">
        <span class="brand-name">ಅಡ್ಮಿನ್ ಪ್ಯಾನೆಲ್</span>
        <span class="brand-tag">ಸಮೃದ್ಧಿ ಪೋರ್ಟಲ್</span>
      </div>
    </a>
    <span style="background: #dcfce7; color: #15803d; font-size: 9.5px; font-weight: 800; padding: 2px 8px; border-radius: 10px;">🟢 LIVE</span>
  </header>

  <div style="display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--border);">
    <button class="admin-tab-btn active" onclick="switchAdminTab('newsTab', this)">📰 ನ್ಯೂಸ್ ಅಪ್‌ಡೇಟ್</button>
    <button class="admin-tab-btn" onclick="switchAdminTab('adsTab', this)">📥 ಆ್ಯಡ್ಸ್ ಅಪ್ರೂವಲ್ (3)</button>
    <button class="admin-tab-btn" onclick="switchAdminTab('tickerTab', this)">🪙 ದರ ಅಪ್‌ಡೇಟ್</button>
  </div>

  <!-- TAB 1: News Management -->
  <div id="newsTab" class="form-card">
    <h3 style="font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 10px;">📰 ಹೋಮ್ ಪೇಜ್ & ಸಿಟಿ ನ್ಯೂಸ್ ಮ್ಯಾನೇಜರ್</h3>
    
    <form onsubmit="saveNewsUpdates(event)">
      <!-- Market News -->
      <div style="background: #f0fdf4; border: 1px solid #bbf7d0; padding: 10px; border-radius: 10px; margin-bottom: 10px;">
        <label style="font-size: 11.5px; font-weight: 800; color: #15803d; display: block; margin-bottom: 4px;">📈 ಮಾರ್ಕೆಟ್ ನ್ಯೂಸ್</label>
        <input type="text" id="adm_adike" class="form-input" placeholder="ಅಡಿಕೆ ಬೆಲೆ" value="ರಾಶಿ ₹54,500/ಕ್ವಿಂ">
        <input type="text" id="adm_kobbari" class="form-input" placeholder="ಕೊಬ್ಬರಿ ಬೆಲೆ" value="₹13,200/ಕ್ವಿಂ">
        <input type="text" id="adm_maize" class="form-input" placeholder="ಮೆಕ್ಕೆಜೋಳ ಬೆಲೆ" value="₹2,150/ಕ್ವಿಂ">
        <textarea id="adm_market_full" class="form-input" rows="2" placeholder="ಮಾರ್ಕೆಟ್ ಪೂರ್ಣ ವಿವರಣೆ..."></textarea>
      </div>

      <!-- Top News -->
      <div style="background: #fffbeb; border: 1px solid #fed7aa; padding: 10px; border-radius: 10px; margin-bottom: 10px;">
        <label style="font-size: 11.5px; font-weight: 800; color: #c2410c; display: block; margin-bottom: 4px;">⚡ TOP ನ್ಯೂಸ್</label>
        <input type="text" id="adm_top1" class="form-input" value="🏛️ ಸ್ಥಳೀಯ ನೈಜ ಉತ್ಪನ್ನಗಳಿಗೆ ಸಮೃದ್ಧಿ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಭಾರಿ ಬೇಡಿಕೆ!">
        <input type="text" id="adm_top2" class="form-input" value="⚡ ನಗರದ ಪ್ರಮುಖ ಬಡಾವಣೆಗಳಲ್ಲಿ ನಾಳೆ 10 ರಿಂದ ವಿದ್ಯುತ್ ನಿರ್ವಹಣೆ.">
        <textarea id="adm_top_full" class="form-input" rows="2" placeholder="TOP ನ್ಯೂಸ್ ಪೂರ್ಣ ವಿವರಣೆ..."></textarea>
      </div>

      <button type="submit" style="width: 100%; background: #2563eb; color: #fff; border: none; padding: 10px; border-radius: 20px; font-weight: 800; font-size: 13px; cursor: pointer;">
        🚀 ಲೈವ್ ಅಪ್‌ಡೇಟ್ ಮಾಡಿ
      </button>
    </form>
  </div>

  <!-- TAB 2: Pending Ads -->
  <div id="adsTab" class="form-card" style="display: none;">
    <h3 style="font-size: 13.5px; font-weight: 800; margin-bottom: 8px;">📥 ಪರಿಶೀಲನೆಗೆ ಬಂದಿರುವ ಜಾಹೀರಾತುಗಳು</h3>
    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px; margin-bottom: 8px;" id="ad1">
      <div style="font-size: 11px; font-weight: 700; color: #2563eb;">📍 ಶಿವಮೊಗ್ಗ • ₹49 ಪ್ಲಾನ್</div>
      <div style="font-size: 12.5px; font-weight: 800;">ಶುದ್ಧ ಗಿರ್ ಹಸುವಿನ ಹಾಲು & ತುಪ್ಪ</div>
      <p style="font-size: 11px; color: #64748b; margin: 4px 0 6px;">ಸಂಪರ್ಕ: 8431649984</p>
      <button style="background: #059669; color: #fff; border: none; padding: 4px 10px; border-radius: 15px; font-size: 10.5px; font-weight: 700; cursor: pointer;" onclick="this.parentElement.innerHTML='<div style=\'color:#059669;font-weight:800;font-size:11px;\'>✓ ಅಪ್ರೂವ್ ಆಗಿದೆ!</div>'">✓ ಅಪ್ರೂವ್</button>
    </div>
  </div>

  <!-- TAB 3: Ticker Rates -->
  <div id="tickerTab" class="form-card" style="display: none;">
    <h3 style="font-size: 13.5px; font-weight: 800; margin-bottom: 8px;">🪙 ದಿನನಿತ್ಯದ ದರ ಅಪ್‌ಡೇಟ್</h3>
    <input type="text" class="form-input" value="22K ಚಿನ್ನ: ₹6,745/g">
    <input type="text" class="form-input" value="ಬೆಳ್ಳಿ: ₹88,500/kg">
    <button style="width: 100%; background: #2563eb; color: #fff; border: none; padding: 9px; border-radius: 20px; font-weight: 700; font-size: 12px;" onclick="alert('ದರ ಸೇವ್ ಆಗಿದೆ!')">💾 ಸೇವ್ ಮಾಡಿ</button>
  </div>

  <!-- Bottom Nav -->
  <nav class="modern-bottom-nav">
    <a href="index.html" class="nav-tab-link"><span class="nav-tab-icon">🏠</span><span>ಮುಖಪುಟ</span></a>
    <a href="order_poster.html" class="nav-tab-link"><span class="nav-tab-icon">🎨</span><span>ಪೋಸ್ಟರ್ ₹59</span></a>
    <a href="post_ad.html" class="nav-center-plus">➕</a>
    <a href="admin.html" class="nav-tab-link active"><span class="nav-tab-icon">⚙️</span><span>ಅಡ್ಮಿನ್</span></a>
    <a href="https://wa.me/918431649984?text=ಸಹಾಯ%20ಬೇಕು" class="nav-tab-link"><span class="nav-tab-icon">💬</span><span>ಹೆಲ್ಪ್‌ಲೈನ್</span></a>
  </nav>

  <script>
    function switchAdminTab(tabId, btn) {
      document.getElementById('newsTab').style.display = 'none';
      document.getElementById('adsTab').style.display = 'none';
      document.getElementById('tickerTab').style.display = 'none';
      document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).style.display = 'block';
      btn.classList.add('active');
    }

    function saveNewsUpdates(e) {
      e.preventDefault();
      var newsData = {
        adike: document.getElementById('adm_adike').value,
        kobbari: document.getElementById('adm_kobbari').value,
        maize: document.getElementById('adm_maize').value,
        top1: document.getElementById('adm_top1').value,
        top2: document.getElementById('adm_top2').value,
        market_full: document.getElementById('adm_market_full').value,
        top_full: document.getElementById('adm_top_full').value
      };
      localStorage.setItem('samruddhi_news_data', JSON.stringify(newsData));
      alert('✅ ನ್ಯೂಸ್ ವಿವರಗಳು ಯಶಸ್ವಿಯಾಗಿ ಲೈವ್ ಅಪ್‌ಡೇಟ್ ಆಗಿವೆ!');
    }

    window.onload = function() {
      var saved = localStorage.getItem('samruddhi_news_data');
      if (saved) {
        var d = JSON.parse(saved);
        if(d.adike) document.getElementById('adm_adike').value = d.adike;
        if(d.kobbari) document.getElementById('adm_kobbari').value = d.kobbari;
        if(d.maize) document.getElementById('adm_maize').value = d.maize;
        if(d.top1) document.getElementById('adm_top1').value = d.top1;
        if(d.top2) document.getElementById('adm_top2').value = d.top2;
        if(d.market_full) document.getElementById('adm_market_full').value = d.market_full;
        if(d.top_full) document.getElementById('adm_top_full').value = d.top_full;
      }
    };
  </script>

</body>
</html>
