<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ದಾವಣಗೆರೆ ಜಾಹೀರಾತುಗಳು - ಸಮೃದ್ಧಿ</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    .city-header-box {
      background: linear-gradient(135deg, #059669, #047857);
      color: #fff;
      padding: 14px 16px;
      margin: 10px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ad-card-item {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      margin: 10px 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .ad-card-item.premium-slot {
      border: 2px solid #f59e0b;
      background: linear-gradient(180deg, #fffbeb 0%, #ffffff 100%);
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15);
    }
    .ad-card-item.super-slot {
      border: 1.5px solid #3b82f6;
      background: #f0f9ff;
    }
    .ad-share-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      justify-content: flex-end;
    }
    .share-btn-action {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #ffffff;
    }
    .btn-wa-green { background: #25d366; }
    .btn-fb-blue { background: #1877f2; }
  </style>
</head>
<body>

  <header class="app-header-modern">
    <a href="index.html" class="brand-logo-wrap">
      <div class="brand-icon">🌾</div>
      <div class="brand-title-box">
        <span class="brand-name">ಸಮೃದ್ಧಿ</span>
        <span class="brand-tag">ದಾವಣಗೆರೆ ಪೋರ್ಟಲ್</span>
      </div>
    </a>
    <a href="post_ad.html" class="header-post-btn">➕ ಆ್ಯಡ್ ಹಾಕಿ</a>
  </header>

  <div class="city-header-box">
    <div>
      <h2 style="font-size: 16px; margin: 0; font-weight: 800;">🌾 ದಾವಣಗೆರೆ ಜಾಹೀರಾತುಗಳು</h2>
      <span style="font-size: 11px; opacity: 0.9;">ಸ್ಥಳೀಯ ರೈತರು & ವ್ಯಾಪಾರಿಗಳ ಉತ್ಪನ್ನಗಳು</span>
    </div>
    <a href="post_ad.html" style="background:#fff; color:#065f46; font-size:11px; font-weight:800; padding:6px 10px; border-radius:20px; text-decoration:none;">+ ಪೋಸ್ಟ್ ಮಾಡಿ</a>
  </div>

  <div id="cityAdsList">
    <p style="text-align:center; font-size:12px; color:#64748b; padding:20px 0;">ಜಾಹೀರಾತುಗಳನ್ನು ಲೋಡ್ ಮಾಡಲಾಗುತ್ತಿದೆ...</p>
  </div>

  <nav class="modern-bottom-nav">
    <a href="index.html" class="nav-tab-link"><span class="nav-tab-icon">🏠</span><span>ಮುಖಪುಟ</span></a>
    <a href="order_poster.html" class="nav-tab-link"><span class="nav-tab-icon">🎨</span><span>ಪೋಸ್ಟರ್ ₹59</span></a>
    <a href="post_ad.html" class="nav-center-plus">➕</a>
    <a href="admin.html" class="nav-tab-link"><span class="nav-tab-icon">⚙️</span><span>ಅಡ್ಮಿನ್</span></a>
    <a href="https://wa.me/918431649984?text=ಸಹಾಯ%20ಬೇಕು" class="nav-tab-link"><span class="nav-tab-icon">💬</span><span>ಹೆಲ್ಪ್‌ಲೈನ್</span></a>
  </nav>

  <script>
    const currentCityCode = "davanagere"; // ದಾವಣಗೆರೆ ಕೋಡ್

    async function loadCityAds() {
      const container = document.getElementById('cityAdsList');
      try {
        if (typeof db === 'undefined') return;

        const snapshot = await db.collection("ads")
          .where("city", "==", currentCityCode)
          .where("status", "==", "approved")
          .get();

        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = `
            <div style="text-align:center; padding:30px 14px; color:#64748b; font-size:12.5px;">
              ಇಲ್ಲಿ ಇನ್ನೂ ಯಾವುದೇ ಜಾಹೀರಾತುಗಳಿಲ್ಲ.<br>
              <a href="post_ad.html" style="color:#059669; font-weight:800; text-decoration:none; display:inline-block; margin-top:8px;">👉 ಮೊದಲಿಗರಾಗಿ ಜಾಹೀರಾತು ಪ್ರಕಟಿಸಿ!</a>
            </div>
          `;
          return;
        }

        let adsArray = [];
        snapshot.forEach(doc => {
          adsArray.push({ id: doc.id, ...doc.data() });
        });

        adsArray.sort((a, b) => (b.priority || b.amount || 0) - (a.priority || a.amount || 0));

        adsArray.forEach(ad => {
          const currentUrl = window.location.href;
          const shareText = `🌾 *ಸಮೃದ್ಧಿ ಜಾಹೀರಾತು:*%0A📌 *${ad.title}*%0A💰 ಬೆಲೆ: ${ad.price || 'ಮಾತುಕತೆ ಮೂಲಕ'}%0A📝 ವಿವರ: ${ad.desc || ad.description || ''}%0A👉 ನೋಡಿ: ${currentUrl}`;
          const waLink = "https://api.whatsapp.com/send?text=" + shareText;
          const fbLink = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(currentUrl);

          const imgTag = ad.imageUrl ? `<img src="${ad.imageUrl}" style="width:100%; max-height:160px; object-fit:cover; border-radius:8px; margin:6px 0;">` : '';

          let slotClass = "";
          let badgeTag = "";

          if (ad.amount === 199 || ad.planType === 'premium') {
            slotClass = "premium-slot";
            badgeTag = `<span style="background:#fef3c7; color:#b45309; font-size:10px; font-weight:800; padding:2px 6px; border-radius:6px; border:1px solid #f59e0b;">💎 ಪ್ರೀಮಿಯಂ</span>`;
          } else if (ad.amount === 99 || ad.planType === 'super') {
            slotClass = "super-slot";
            badgeTag = `<span style="background:#e0f2fe; color:#0369a1; font-size:10px; font-weight:800; padding:2px 6px; border-radius:6px;">👑 ಸೂಪರ್</span>`;
          } else if (ad.amount === 49) {
            badgeTag = `<span style="background:#f1f5f9; color:#475569; font-size:10px; font-weight:800; padding:2px 6px; border-radius:6px;">⭐ ಹೈಲೈಟ್</span>`;
          } else {
            badgeTag = `<span style="background:#ecfdf5; color:#065f46; font-size:10px; font-weight:800; padding:2px 6px; border-radius:6px;">🆓 ಉಚಿತ</span>`;
          }

          container.innerHTML += `
            <div class="ad-card-item ${slotClass}">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                ${badgeTag}
                ${ad.price ? `<span style="font-size:11.5px; font-weight:800; color:#0f172a;">💰 ${ad.price}</span>` : ''}
              </div>
              ${imgTag}
              <div style="font-size:13.5px; font-weight:800; color:#0f172a; margin-top:4px;">${ad.title}</div>
              <div style="font-size:12px; color:#475569; margin:4px 0 6px; line-height:1.4;">${ad.desc || ad.description || ''}</div>
              
              <div class="ad-share-row">
                <a href="${waLink}" target="_blank" class="share-btn-action btn-wa-green">💬 ಶೇರ್</a>
                <a href="${fbLink}" target="_blank" class="share-btn-action btn-fb-blue">📘 ಶೇರ್</a>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadCityAds);
  </script>
</body>
</html>
