      });
    }
    if (typeof db !== 'undefined') {
      db.collection("ads").where("status", "==", "approved").onSnapshot(s => {
        if(!s.empty){ ads = []; s.forEach(d => ads.push(d.data())); displayAds(); }
      });
    }
    displayAds();
