      <div style="font-size: 11px; color: #64748b; margin-bottom: 14px;">📅 ದಿನಾಂಕ: ಇಂದಿನ ಪ್ರಕಟಣೆ | ✍️ ಸಮೃದ್ಧಿ ಸ್ಥಳೀಯ ವರದಿ</div>
      
      <hr style="border: 0; border-top: 1.5px solid #f1f5f9; margin-bottom: 14px;">

        ಮಾಹಿತಿಯನ್ನು ಪಡೆಯಲಾಗುತ್ತಿದೆ...

    <a href="admin.html" class="nav-tab-link"><span class="nav-tab-icon">⚙️</span><span>ಅಡ್ಮಿನ್</span></a>

  </nav>

  <script>
    async function loadFullNews() {
      const urlParams = new URLSearchParams(window.location.search);
      const city = urlParams.get('city');
      const type = urlParams.get('type');

      const targetKey = city || (type === 'market' ? 'market_news' : 'top_news');

      // 1. ಮೊದಲು LocalStorage ಬ್ಯಾಕಪ್ ಚೆಕ್
      const local = JSON.parse(localStorage.getItem('samruddhi_news_data') || '{}');
      if (local[targetKey]) {
        document.getElementById('newsHeading').innerText = local[targetKey].title;
        document.getElementById('newsBody').innerText = local[targetKey].content;
        document.getElementById('newsTag').innerText = `📍 ${targetKey.toUpperCase()} ತಾಜಾ ಸುದ್ದಿ`;
      }

      // 2. Firebase ನಿಂದ ಲೈವ್ ಸುದ್ದಿ ಲೋಡ್ ಮಾಡಿ
      try {
        if (typeof db !== 'undefined') {
          const snapshot = await db.collection("news")
            .where("category", "==", targetKey)
            .orderBy("timestamp", "desc")
            .limit(1)
            .get();

          if (!snapshot.empty) {
            const data = snapshot.docs[0].data();
            document.getElementById('newsHeading').innerText = data.title;
            document.getElementById('newsBody').innerText = data.content;
            document.getElementById('newsTag').innerText = `📍 ${data.category.toUpperCase()} ತಾಜಾ ಸುದ್ದಿ`;
            return;
          }
        }
      } catch (err) {
        console.warn("Firebase fetch note:", err);
      }

      // ಒಂದು ವೇಳೆ ಅಡ್ಮಿನ್‌ನಲ್ಲಿ ಇನ್ನೂ ಸುದ್ದಿ ಹಾಕಿರದಿದ್ದರೆ ಮಾತ್ರ ಡೀಫಾಲ್ಟ್ ಸಂದೇಶ
      if (!local[targetKey]) {
        document.getElementById('newsHeading').innerText = "ಸ್ಥಳೀಯ ತಾಜಾ ಸುದ್ದಿ ಮತ್ತು ಮಾರುಕಟ್ಟೆ ವರದಿ";
        document.getElementById('newsBody').innerText = "ಈ ವಿಭಾಗಕ್ಕೆ ಅಡ್ಮಿನ್ ಪ್ಯಾನೆಲ್ ಮೂಲಕ ಶೀಘ್ರದಲ್ಲೇ ತಾಜಾ ಸುದ್ದಿಗಳನ್ನು ಅಪ್‌ಲೋಡ್ ಮಾಡಲಾಗುವುದು.\n\nಸ್ಥಳೀಯ ಜಾಹೀರಾತುಗಳು ಹಾಗೂ ವ್ಯಾಪಾರ ಮಾಹಿತಿಗಾಗಿ ಮುಖಪುಟವನ್ನು ವೀಕ್ಷಿಸಿ.";
      }
    }

    window.addEventListener('DOMContentLoaded', loadFullNews);
  </script>
</body>
