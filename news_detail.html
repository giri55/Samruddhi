<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ಸುದ್ದಿ ವಿವರ - ಸಮೃದ್ಧಿ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .news-detail-box {
      background: #ffffff;
      margin: 12px 14px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .news-type-tag {
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .tag-market { background: #dcfce7; color: #15803d; }
    .tag-top { background: #ffedd5; color: #c2410c; }
    .tag-city { background: #dbeafe; color: #1d4ed8; }
    .news-headline {
      font-size: 15.5px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .news-meta-bar {
      font-size: 11px;
      color: #64748b;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .news-full-body {
      font-size: 13px;
      color: #334155;
      line-height: 1.6;
      white-space: pre-line;
      margin-bottom: 16px;
    }
    .news-share-btn {
      background: #25d366;
      color: #ffffff;
      padding: 9px 14px;
      border-radius: 25px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header-modern">
    <a href="index.html" class="brand-logo-wrap">
      <div class="brand-icon">🌾</div>
      <div class="brand-title-box">
        <span class="brand-name">ಸಮೃದ್ಧಿ</span>
        <span class="brand-tag">ಸುದ್ದಿ ವಿವರ</span>
      </div>
    </a>
    <a href="post_ad.html" class="header-post-btn">➕ ಆ್ಯಡ್ ಹಾಕಿ</a>
  </header>

  <div class="news-detail-box">
    <span id="newsTag" class="news-type-tag tag-top">ಸುದ್ದಿ ವಿವರ</span>
    <h1 id="newsTitle" class="news-headline">ಸುದ್ದಿ ಲೋಡ್ ಆಗುತ್ತಿದೆ...</h1>
    
    <div class="news-meta-bar">
      <span>✍️ ಸಮೃದ್ಧಿ ವರದಿ</span>
      <span id="newsTime">ಇಂದಿನ ತಾಜಾ ಸುದ್ದಿ</span>
    </div>

    <div id="newsBody" class="news-full-body">
      ಮಾಹಿತಿ ಲೋಡ್ ಆಗುತ್ತಿದೆ...
    </div>

    <a id="newsShareLink" href="#" class="news-share-btn">
      💬 ಈ ಸುದ್ದಿಯನ್ನು WhatsApp ನಲ್ಲಿ ಶೇರ್ ಮಾಡಿ
    </a>
  </div>

  <!-- Bottom Nav -->
  <nav class="modern-bottom-nav">
    <a href="index.html" class="nav-tab-link active"><span class="nav-tab-icon">🏠</span><span>ಮುಖಪುಟ</span></a>
    <a href="order_poster.html" class="nav-tab-link"><span class="nav-tab-icon">🎨</span><span>ಪೋಸ್ಟರ್ ₹59</span></a>
    <a href="post_ad.html" class="nav-center-plus">➕</a>
    <a href="admin.html" class="nav-tab-link"><span class="nav-tab-icon">⚙️</span><span>ಅಡ್ಮಿನ್</span></a>
    <a href="https://wa.me/918431649984?text=ಸಮೃದ್ಧಿ%20ಪೋರ್ಟಲ್%20ಸಹಾಯ%20ಬೇಕು" class="nav-tab-link"><span class="nav-tab-icon">💬</span><span>ಹೆಲ್ಪ್‌ಲೈನ್</span></a>
  </nav>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var urlParams = new URLSearchParams(window.location.search);
      var type = urlParams.get('type') || 'top';
      var city = urlParams.get('city') || '';
      var saved = localStorage.getItem('samruddhi_news_data');
      
      var title = "ತಾಜಾ ಸುದ್ದಿ ವರದಿ";
      var body = "ಮಾಹಿತಿ ಅಪ್‌ಡೇಟ್ ಆಗುತ್ತಿದೆ...";
      var tagText = "⚡ TOP ನ್ಯೂಸ್";
      var tagClass = "tag-top";

      if (city) {
        tagText = "📍 " + city + " ತಾಜಾ ಸುದ್ದಿ";
        tagClass = "tag-city";
        title = city + " ನಗರ ಮತ್ತು ಸುತ್ತಮುತ್ತಲಿನ ಪ್ರಮುಖ ಬೆಳವಣಿಗೆಗಳು";
        body = city + " ನಗರದಲ್ಲಿ ಸ್ಥಳೀಯ ವಹಿವಾಟು ಹಾಗೂ ನೈಜ ಉತ್ಪನ್ನಗಳ ಬೇಡಿಕೆ ಹೆಚ್ಚಾಗಿದೆ.\n\n• ಕೃಷಿ ಮಾರುಕಟ್ಟೆ ಹಾಗೂ ಅಗತ್ಯ ವಸ್ತುಗಳ ಪೂರೈಕೆ ಸಹಜ ಸ್ಥಿತಿಯಲ್ಲಿದೆ.\n• ಹೊಸ ಜಾಹೀರಾತುಗಳು ಹಾಗೂ ಉದ್ಯೋಗಾವಕಾಶಗಳು ಸಮೃದ್ಧಿ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಲಭ್ಯವಿದೆ.\n\nನಿಮ್ಮೂರಿನ ಯಾವುದೇ ನೈಜ ಉತ್ಪನ್ನ ಅಥವಾ ಸೇವೆಗಳ ಪ್ರಚಾರಕ್ಕಾಗಿ ಸಮೃದ್ಧಿ ಪೋರ್ಟಲ್ ಬಳಸಿಕೊಳ್ಳಿ.";
      } else if (saved) {
        var d = JSON.parse(saved);
        if (type === 'market') {
          tagText = "📈 ಮಾರ್ಕೆಟ್ ನ್ಯೂಸ್";
          tagClass = "tag-market";
          title = "ಇಂದಿನ ಪ್ರಮುಖ ಕೃಷಿ ಮಾರುಕಟ್ಟೆ & ಎಪಿಎಂಸಿ ದರಗಳ ಸಂಪೂರ್ಣ ವರದಿ";
          body = (d.market_full) ? d.market_full : 
                 "• ಅಡಿಕೆ ರಾಶಿ: " + (d.adike || '₹54,500/ಕ್ವಿಂ') + "\n• ಕೊಬ್ಬರಿ: " + (d.kobbari || '₹13,200/ಕ್ವಿಂ') + "\n• ಮೆಕ್ಕೆಜೋಳ: " + (d.maize || '₹2,150/ಕ್ವಿಂ') + "\n\nರಾಜ್ಯದ ಪ್ರಮುಖ ಎಪಿಎಂಸಿ ಮಾರುಕಟ್ಟೆಗಳಲ್ಲಿ ಇಂದಿನ ಆವಕ ಮತ್ತು ಧಾರಣೆ ಸ್ಥಿರವಾಗಿದೆ.";
        } else {
          tagText = "⚡ TOP ನ್ಯೂಸ್";
          tagClass = "tag-top";
          title = d.top1 || "ಸ್ಥಳೀಯ ನೈಜ ಉತ್ಪನ್ನಗಳಿಗೆ ಸಮೃದ್ಧಿ ಪೋರ್ಟಲ್‌ನಲ್ಲಿ ಭಾರಿ ಬೇಡಿಕೆ!";
          body = (d.top_full) ? d.top_full : 
                 (d.top1 || '') + "\n\n" + (d.top2 || '') + "\n\nನಮ್ಮೂರ ನೈಜ ವಸ್ತುಗಳ ನೇರ ಮಾರಾಟ ಮತ್ತು ಖರೀದಿಗೆ ಸಾರ್ವಜನಿಕರಿಂದ ಉತ್ತಮ ಪ್ರತಿಕ್ರಿಯೆ ವ್ಯಕ್ತವಾಗುತ್ತಿದೆ.";
        }
      }

      document.getElementById('newsTag').innerText = tagText;
      document.getElementById('newsTag').className = "news-type-tag " + tagClass;
      document.getElementById('newsTitle').innerText = title;
      document.getElementById('newsBody').innerText = body;

      var shareMsg = "📰 *" + encodeURIComponent(title) + "*%0A%0A" + encodeURIComponent(body.substring(0, 120)) + "...%0A%0Aಸಂಪೂರ್ಣ ಓದಲು ಕ್ಲಿಕ್ ಮಾಡಿ: " + window.location.href;
      document.getElementById('newsShareLink').href = "https://wa.me/?text=" + shareMsg;
    });
  </script>

</body>
</html>
